name: Mission 5 — Testes HTTP Staging

# =============================================================================
# MARKET IMOBI CRM — Homologação HTTP da Mission 5
#
# Executa os testes HT0–HT7 do script test-mission5-http.sh contra o Worker
# de staging exclusivamente. Nenhum ambiente de produção é tocado.
#
# COMO ACIONAR (manual):
#   GitHub → Actions → "Mission 5 — Testes HTTP Staging" → Run workflow
#   Branch: feat/market-imobi-crm-staging
#   Preencha o campo "CONFIRMAR" com o valor exato CONFIRMAR
#
# SECRETS NECESSÁRIOS (já configurados no repositório):
#   CF_ACCESS_CLIENT_ID     — CF Access Service Token client-id
#   CF_ACCESS_CLIENT_SECRET — CF Access Service Token client-secret
#   (mesmos usados em integration-tests-staging.yml)
#
# RESTRIÇÕES:
#   - Apenas workflow_dispatch (sem push, sem PR, sem schedule)
#   - Dados fictícios com prefixo único por execução (run_id do GitHub)
#   - Nenhuma credencial ou token registrado em logs ou artefatos
#   - Nenhuma alteração em produção, migrations, CF Access ou Worker de backup
#   - Nenhum deploy executado
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite CONFIRMAR para autorizar a execução dos testes'
        required: true
        default: ''

# Permissões mínimas — apenas leitura do repositório e escrita de artefatos
permissions:
  contents: read
  actions: write   # necessário para upload-artifact

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # confirm-gate — Nenhum job de teste inicia sem confirmação explícita
  # ───────────────────────────────────────────────────────────────────────────
  confirm-gate:
    name: Verificar CONFIRMAR
    runs-on: ubuntu-latest
    steps:
      - name: Validar confirmação
        run: |
          if [ "${{ github.event.inputs.confirmar }}" != "CONFIRMAR" ]; then
            echo "BLOQUEADO: o campo deve conter exatamente CONFIRMAR"
            exit 1
          fi
          echo "✅ Confirmação válida — prosseguindo"

  # ───────────────────────────────────────────────────────────────────────────
  # mission5-http — Execução dos testes HT0–HT7
  # ───────────────────────────────────────────────────────────────────────────
  mission5-http:
    name: HT0–HT7 → api-staging.queromeumcmv.com.br
    runs-on: ubuntu-latest
    needs: confirm-gate
    environment: staging

    steps:
      # ── 1. Checkout da branch de staging ───────────────────────────────────
      - name: Checkout feat/market-imobi-crm-staging
        uses: actions/checkout@v4
        with:
          ref: feat/market-imobi-crm-staging

      # ── 2. Dependências do runner ───────────────────────────────────────────
      - name: Instalar jq
        run: |
          # jq já vem pré-instalado no ubuntu-latest; confirma versão
          jq --version || (sudo apt-get update -qq && sudo apt-get install -y jq)

      # ── 3. Preparar diretório de resultados ─────────────────────────────────
      - name: Criar diretório test-results/
        run: mkdir -p test-results

      # ── 4. Verificar alcançabilidade do staging (diagnóstico pré-teste) ─────
      #    Falha aqui indica problema de rede no runner, não no Worker.
      #    Usa service token — sem sessão de browser necessária.
      - name: Pré-verificação de conectividade
        env:
          CF_SVC_ID:  ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SVC_SEC: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          echo "Verificando acesso ao staging..."
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            -H "CF-Access-Client-Id: $CF_SVC_ID" \
            -H "CF-Access-Client-Secret: $CF_SVC_SEC" \
            "https://api-staging.queromeumcmv.com.br/health")
          echo "Health check pré-teste: HTTP $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "BLOQUEIO: staging retornou HTTP $HTTP antes dos testes."
            echo "Possíveis causas:"
            echo "  - Service Token inválido ou expirado (secrets CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET)"
            echo "  - Worker não deployado no staging"
            echo "  - CF Access não autoriza este Service Token"
            exit 1
          fi
          echo "✅ Staging acessível — prosseguindo com HT0–HT7"

      # ── 5. Executar script de testes ─────────────────────────────────────────
      #    CF_SERVICE_TOKEN_ID e CF_SERVICE_TOKEN_SECRET ativam o modo de
      #    autenticação via Service Token no script (sem CF_TOKEN / sem JWT).
      #    Credenciais passadas via env — nunca via argumento de processo.
      - name: Executar test-mission5-http.sh (HT0–HT7)
        env:
          CF_SERVICE_TOKEN_ID:     ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          chmod +x scripts/test-mission5-http.sh
          # O script cria test-results/ próprio; garantimos que existe
          mkdir -p test-results
          ./scripts/test-mission5-http.sh
          echo "SCRIPT_EXIT=$?" >> "$GITHUB_ENV"

      # ── 6. Resumo no GitHub Actions Summary ──────────────────────────────────
      - name: Gerar resumo no Actions Summary
        if: always()
        run: |
          LOG=$(ls test-results/mission5-http-*.log 2>/dev/null | sort | tail -1)
          JSON=$(ls test-results/mission5-http-*.json 2>/dev/null | sort | tail -1)

          echo "## Mission 5 — Resultado dos Testes HTTP" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run ID:** \`${{ github.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`feat/market-imobi-crm-staging\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Alvo:** \`https://api-staging.queromeumcmv.com.br\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ -f "$JSON" ]]; then
            PASS=$(jq -r '.summary.pass' "$JSON" 2>/dev/null || echo "?")
            FAIL=$(jq -r '.summary.fail' "$JSON" 2>/dev/null || echo "?")
            TOTAL=$(jq -r '.summary.total' "$JSON" 2>/dev/null || echo "?")

            echo "### Resumo" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Resultado | Qtde |" >> "$GITHUB_STEP_SUMMARY"
            echo "|-----------|------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| ✅ PASS   | $PASS  |" >> "$GITHUB_STEP_SUMMARY"
            echo "| ❌ FAIL   | $FAIL  |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Total** | **$TOTAL** |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            echo "### Detalhes por teste" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Teste | Resultado | Detalhe |" >> "$GITHUB_STEP_SUMMARY"
            echo "|-------|-----------|---------|" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.tests[] | "| \(.test) | \(if .result == "PASS" then "✅ PASS" else "❌ FAIL" end) | \(.reason // "-") |"' \
              "$JSON" 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "⚠️ Arquivo JSON de resultados não encontrado." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Artefatos \`.log\` e \`.json\` disponíveis na aba **Artifacts** desta execução." \
            >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> **Segurança:** nenhum token, JWT ou credencial foi registrado nos logs ou artefatos." \
            >> "$GITHUB_STEP_SUMMARY"

      # ── 7. Upload dos artefatos (log + json) ─────────────────────────────────
      #    Sem credenciais — sanitizados pelo próprio script.
      - name: Upload artefatos de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission5-http-results-${{ github.run_id }}
          path: test-results/mission5-http-*.{log,json}
          retention-days: 30
          if-no-files-found: warn

      # ── 8. Resultado final — falha explícita se algum teste reprovado ─────────
      - name: Verificar resultado final
        if: always()
        run: |
          JSON=$(ls test-results/mission5-http-*.json 2>/dev/null | sort | tail -1)
          if [[ -z "$JSON" ]]; then
            echo "❌ FALHA: arquivo de resultados não gerado (o script pode ter abortado antes de HT0)"
            exit 1
          fi

          PASS=$(jq -r '.summary.pass' "$JSON" 2>/dev/null || echo "0")
          FAIL=$(jq -r '.summary.fail' "$JSON" 2>/dev/null || echo "1")

          echo "Resultado final: PASS=$PASS  FAIL=$FAIL"

          if [[ "$FAIL" -gt 0 ]]; then
            echo ""
            echo "❌ MISSION 5 HTTP — REPROVADA ($FAIL teste(s) falharam)"
            echo "Baixe os artefatos desta execução para ver o diagnóstico completo."
            echo "Não iniciar a Mission 6 sem aprovação de todos os testes."
            exit 1
          fi

          echo ""
          echo "🏆 MISSION 5 HTTP — APROVADA (todos os $PASS testes passaram)"
          echo "Artefatos disponíveis na aba Artifacts desta execução."

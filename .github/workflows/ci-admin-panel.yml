name: CI — Admin Panel (build + TypeScript)

# ─── Gatilhos ────────────────────────────────────────────────────────────────
on:
  # 1. Push na branch de feature tocando admin-panel/ OU este próprio arquivo
  push:
    branches:
      - feat/webhook-meta-lead-ads
    paths:
      - 'admin-panel/**'
      - '.github/workflows/ci-admin-panel.yml'

  # 2. PRs para main que tocam admin-panel/
  pull_request:
    branches:
      - main
    paths:
      - 'admin-panel/**'
      - '.github/workflows/ci-admin-panel.yml'

  # 3. Disparo manual via GitHub Actions UI ou API
  workflow_dispatch:

# ─── Permissões mínimas ─────────────────────────────────────────────────────
permissions:
  contents: read

jobs:
  build:
    name: TypeScript + Vite Build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout da branch atual
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js 22 LTS
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Sem cache: projeto não tem package-lock.json

      # 3. Instalar dependências
      - name: Install dependencies
        working-directory: admin-panel
        run: npm install

      # 4. Verificação TypeScript (sem emitir arquivos)
      - name: TypeScript check
        working-directory: admin-panel
        run: npx tsc --noEmit

      # 5. Build de produção com Vite
      - name: Vite build
        working-directory: admin-panel
        run: npm run build

      # 6. Verificar artefato de build
      - name: Verify build output
        working-directory: admin-panel
        run: |
          if [ -d dist ]; then
            echo "✅ dist/ gerado com sucesso"
            du -sh dist/
            ls dist/assets/*.js 2>/dev/null | head -5
          else
            echo "❌ dist/ não encontrado"
            exit 1
          fi

      # 7. Upload do artefato de build (retido por 7 dias)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-dist-${{ github.sha }}
          path: admin-panel/dist/
          retention-days: 7

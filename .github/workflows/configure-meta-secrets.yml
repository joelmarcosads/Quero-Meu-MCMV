name: Configurar Secrets Meta — Staging

# ─── PROPÓSITO ────────────────────────────────────────────────────────────────
# Configura os secrets META_* no Worker market-imobi-crm-staging de forma segura.
# Os valores passam APENAS via GitHub Secrets → wrangler secret put (stdin pipe).
# Nunca aparecem em logs, commits ou outputs.
#
# COMO USAR (único momento em que você define os valores):
#   1. GitHub → Settings → Secrets and variables → Actions → New repository secret
#      Criar OU atualizar cada um:
#        STAGING_META_VERIFY_TOKEN    → token gerado pelo CRM (veja instruções)
#        STAGING_META_APP_SECRET      → App Secret do seu Meta App
#        STAGING_META_PAGE_ACCESS_TOKEN → Page Access Token com permissão leads_retrieval
#        STAGING_META_PAGE_ID         → (opcional) ID numérico da sua Página Meta
#
#   2. GitHub → Actions → "Configurar Secrets Meta — Staging" → Run workflow
#      Digite CONFIRMAR no campo de confirmação e selecione quais secrets configurar.
#
# SEGURANÇA:
#   - Os valores NÃO aparecem nos logs (wrangler mascara secrets)
#   - O workflow lê de GitHub Secrets → passa por stdin (echo | wrangler)
#   - Não é possível extrair o valor de um secret depois de configurado
#
# ─── RESTRIÇÕES ───────────────────────────────────────────────────────────────
# Este workflow NÃO toca em:
#   - market-imobi-crm (produção)
#   - market-imobi-backup
#   - Cloudflare Access policies
#   - D1 databases
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite CONFIRMAR para autorizar a configuração'
        required: true
        default: ''
      set_verify_token:
        description: 'Configurar META_VERIFY_TOKEN? (requer STAGING_META_VERIFY_TOKEN no GitHub Secrets)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      set_app_secret:
        description: 'Configurar META_APP_SECRET? (requer STAGING_META_APP_SECRET no GitHub Secrets)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      set_page_token:
        description: 'Configurar META_PAGE_ACCESS_TOKEN? (requer STAGING_META_PAGE_ACCESS_TOKEN)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      set_page_id:
        description: 'Configurar META_PAGE_ID? (opcional — requer STAGING_META_PAGE_ID)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

jobs:
  configure-secrets:
    name: Configurar secrets Meta → market-imobi-crm-staging
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirmar == 'CONFIRMAR' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/market-imobi-crm-staging

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        working-directory: crm-worker
        run: npm install

      - name: Configurar META_VERIFY_TOKEN
        if: ${{ github.event.inputs.set_verify_token == 'true' }}
        working-directory: crm-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SECRET_VALUE: ${{ secrets.STAGING_META_VERIFY_TOKEN }}
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            echo "❌ STAGING_META_VERIFY_TOKEN não configurado no GitHub Secrets"
            exit 1
          fi
          echo "$SECRET_VALUE" | npx wrangler secret put META_VERIFY_TOKEN --env staging
          echo "✅ META_VERIFY_TOKEN configurado (valor mascarado)"

      - name: Configurar META_APP_SECRET
        if: ${{ github.event.inputs.set_app_secret == 'true' }}
        working-directory: crm-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SECRET_VALUE: ${{ secrets.STAGING_META_APP_SECRET }}
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            echo "❌ STAGING_META_APP_SECRET não configurado no GitHub Secrets"
            exit 1
          fi
          echo "$SECRET_VALUE" | npx wrangler secret put META_APP_SECRET --env staging
          echo "✅ META_APP_SECRET configurado (valor mascarado)"

      - name: Configurar META_PAGE_ACCESS_TOKEN
        if: ${{ github.event.inputs.set_page_token == 'true' }}
        working-directory: crm-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SECRET_VALUE: ${{ secrets.STAGING_META_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            echo "❌ STAGING_META_PAGE_ACCESS_TOKEN não configurado no GitHub Secrets"
            exit 1
          fi
          echo "$SECRET_VALUE" | npx wrangler secret put META_PAGE_ACCESS_TOKEN --env staging
          echo "✅ META_PAGE_ACCESS_TOKEN configurado (valor mascarado)"

      - name: Configurar META_PAGE_ID (opcional)
        if: ${{ github.event.inputs.set_page_id == 'true' }}
        working-directory: crm-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SECRET_VALUE: ${{ secrets.STAGING_META_PAGE_ID }}
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            echo "⚠️  STAGING_META_PAGE_ID não configurado — pulando (campo opcional)"
            exit 0
          fi
          echo "$SECRET_VALUE" | npx wrangler secret put META_PAGE_ID --env staging
          echo "✅ META_PAGE_ID configurado (valor mascarado)"

      - name: Listar secrets configurados (apenas nomes, sem valores)
        working-directory: crm-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo "Secrets atualmente no Worker market-imobi-crm-staging:"
          npx wrangler secret list --env staging
          echo ""
          echo "✅ Configuração concluída."
          echo "Próximo passo: registrar webhook na Meta Developer Platform com:"
          echo "  URL: https://api-staging.queromeumcmv.com.br/api/v1/webhook/meta"
          echo "  Token: o valor de STAGING_META_VERIFY_TOKEN que você configurou"
          echo "  Campos: leadgen"

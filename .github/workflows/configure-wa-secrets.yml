name: Configurar Secrets WhatsApp — Staging

# ─── PROPÓSITO ────────────────────────────────────────────────────────────────
# Configura os secrets WA_* no Worker market-imobi-crm-staging de forma segura.
# Os valores passam APENAS via GitHub Secrets → wrangler secret put (stdin pipe).
# Nunca aparecem em logs, commits ou outputs.
#
# COMO USAR (único momento em que você define os valores):
#   1. GitHub → Settings → Secrets and variables → Actions → New repository secret
#      Criar OU atualizar cada um:
#        STAGING_WA_PHONE_NUMBER_ID   → Phone Number ID do App Meta (Getting Started)
#        STAGING_WA_ACCESS_TOKEN      → Temporary access token (Getting Started)
#
#   2. GitHub → Actions → "Configurar Secrets WhatsApp — Staging" → Run workflow
#      Digite CONFIRMAR no campo de confirmação e selecione quais secrets configurar.
#
# ONDE OBTER OS VALORES:
#   developers.facebook.com → seu App → WhatsApp → Getting Started
#   - "Phone number ID"      → STAGING_WA_PHONE_NUMBER_ID
#   - "Temporary access token" → STAGING_WA_ACCESS_TOKEN
#     (token temporário expira em ~24h; para produção usar System User Token)
#
# SEGURANÇA:
#   - Os valores NÃO aparecem nos logs (wrangler mascara secrets)
#   - O workflow lê de GitHub Secrets → passa por stdin (echo | wrangler)
#   - Não é possível extrair o valor de um secret depois de configurado
#
# ─── RESTRIÇÕES ───────────────────────────────────────────────────────────────
# Este workflow NÃO toca em:
#   - market-imobi-crm (produção)
#   - market-imobi-backup
#   - Cloudflare Access policies
#   - D1 databases
#   - Integração Meta Lead Ads (Missão 6)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite CONFIRMAR para autorizar a configuração'
        required: true
        default: ''
      set_phone_number_id:
        description: 'Configurar WA_PHONE_NUMBER_ID? (requer STAGING_WA_PHONE_NUMBER_ID no GitHub Secrets)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      set_access_token:
        description: 'Configurar WA_ACCESS_TOKEN? (requer STAGING_WA_ACCESS_TOKEN no GitHub Secrets)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

jobs:
  configure-wa-secrets:
    name: Configurar secrets WhatsApp → market-imobi-crm-staging
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirmar == 'CONFIRMAR' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/market-imobi-crm-staging

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        working-directory: crm-worker
        run: npm install

      - name: Configurar WA_PHONE_NUMBER_ID
        if: ${{ github.event.inputs.set_phone_number_id == 'true' }}
        working-directory: crm-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SECRET_VALUE: ${{ secrets.STAGING_WA_PHONE_NUMBER_ID }}
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            echo "❌ STAGING_WA_PHONE_NUMBER_ID não configurado no GitHub Secrets"
            echo "   Vá em: GitHub → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "$SECRET_VALUE" | npx wrangler secret put WA_PHONE_NUMBER_ID --env staging
          echo "✅ WA_PHONE_NUMBER_ID configurado (valor mascarado)"

      - name: Configurar WA_ACCESS_TOKEN
        if: ${{ github.event.inputs.set_access_token == 'true' }}
        working-directory: crm-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SECRET_VALUE: ${{ secrets.STAGING_WA_ACCESS_TOKEN }}
        run: |
          if [ -z "$SECRET_VALUE" ]; then
            echo "❌ STAGING_WA_ACCESS_TOKEN não configurado no GitHub Secrets"
            echo "   Vá em: GitHub → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "$SECRET_VALUE" | npx wrangler secret put WA_ACCESS_TOKEN --env staging
          echo "✅ WA_ACCESS_TOKEN configurado (valor mascarado)"

      - name: Listar secrets configurados (apenas nomes, sem valores)
        working-directory: crm-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo "Secrets atualmente no Worker market-imobi-crm-staging:"
          npx wrangler secret list --env staging
          echo ""
          echo "✅ Configuração concluída."
          echo ""
          echo "Próximo passo: deploy do Worker"
          echo "  GitHub → Actions → 'Deploy Worker — Staging' → Run workflow → CONFIRMAR"
          echo ""
          echo "Após o deploy, testar:"
          echo "  GET https://api-staging.queromeumcmv.com.br/api/v1/whatsapp/status"
          echo "  GET https://api-staging.queromeumcmv.com.br/api/v1/whatsapp/log"

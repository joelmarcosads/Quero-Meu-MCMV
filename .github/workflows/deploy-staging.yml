name: Deploy Worker — Staging

# ─── Disparo manual pelo browser ────────────────────────────────────────────
# GitHub → Actions → "Deploy Worker — Staging" → Run workflow
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite CONFIRMAR para autorizar o deploy'
        required: true
        default: ''

# ─── Permissões mínimas ──────────────────────────────────────────────────────
permissions:
  contents: read

jobs:
  deploy-staging:
    name: Build & Deploy → api-staging.queromeumcmv.com.br
    runs-on: ubuntu-latest
    environment: staging          # opcional: adicione proteção de ambiente no GitHub

    # Bloqueia runs acidentais sem confirmação explícita
    if: ${{ github.event.inputs.confirmar == 'CONFIRMAR' }}

    steps:
      # 1. Checkout da branch de staging (nunca toca em main)
      - name: Checkout feat/market-imobi-crm-staging
        uses: actions/checkout@v4
        with:
          ref: feat/market-imobi-crm-staging

      # 2. Node 22 LTS (20 depreciado nos runners GitHub em 2026)
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Instalar dependências (inclui wrangler ^3.87.0)
      #    npm install usado pois não há package-lock.json no repo
      - name: Install dependencies
        working-directory: crm-worker
        run: npm install

      # 4. Compilar TypeScript → dist/worker.js (esbuild via wrangler)
      #    O wrangler compila internamente ao fazer deploy
      #    Não é necessário rodar esbuild separado

      # 5. Deploy → ambiente staging (rota api-staging.queromeumcmv.com.br)
      - name: Deploy Worker to staging
        working-directory: crm-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo "🚀 Deploy iniciado em $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          npx wrangler deploy --env staging
          echo "✅ Deploy concluído"

      # 6. Instrução pós-deploy
      #    O health check automático foi removido porque o hostname está protegido
      #    pelo Cloudflare Access — curl sem sessão recebe 302/403 mesmo com o
      #    Worker funcionando. Teste manualmente após o deploy:
      #
      #    Opção A (browser com sessão CF Access):
      #      https://api-staging.queromeumcmv.com.br/health
      #
      #    Opção B (curl com bypass configurado no Dashboard):
      #      Zero Trust → Access → Applications → Market Imobi CRM - Staging
      #      → adicionar regra Bypass para Path = /health
      #
      - name: Instrucoes pos-deploy
        run: |
          echo "✅ Deploy concluído com sucesso."
          echo ""
          echo "Para verificar o Worker, abra no browser (com sessão CF Access ativa):"
          echo "  https://api-staging.queromeumcmv.com.br/health"
          echo ""
          echo "Ou consulte: Cloudflare Dashboard → Workers → market-imobi-crm-staging → Logs"

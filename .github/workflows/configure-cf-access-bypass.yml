name: Configurar CF Access Bypass — Webhook Meta

# ─── PROPÓSITO ────────────────────────────────────────────────────────────────
# Adiciona regra Bypass no Cloudflare Access para /api/v1/webhook/meta (staging).
# Sem essa regra, a Meta não consegue entregar webhooks ao Worker (recebe 401/403).
#
# COMO USAR:
#   GitHub → Actions → "Configurar CF Access Bypass — Webhook Meta" → Run workflow
#   Digite CONFIRMAR no campo e execute.
#
# O que faz:
#   1. Lista as aplicações de Access do account
#   2. Localiza a aplicação do staging (api-staging.queromeumcmv.com.br)
#   3. Cria política Bypass para o path /api/v1/webhook/meta
#   4. (Se necessário) cria também para /api/v1/public/leads se ainda não existir

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite CONFIRMAR para adicionar a regra Bypass'
        required: true
        type: string

jobs:
  add-bypass-rule:
    name: Adicionar regra Bypass CF Access
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirmar == 'CONFIRMAR' }}

    steps:
      - name: Listar aplicações CF Access
        id: list_apps
        run: |
          echo "🔍 Listando aplicações CF Access..."
          RESPONSE=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID || '5f8abdde2df34998f0454821d8be59da' }}/access/apps" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json")

          echo "Resposta:"
          echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          if not data.get('success'):
            print('ERRO:', json.dumps(data.get('errors', []), indent=2))
            sys.exit(1)
          apps = data.get('result', [])
          print(f'Total de aplicações: {len(apps)}')
          for app in apps:
            print(f\"  - {app.get('name')} | {app.get('domain')} | id={app.get('id')}\")
          # Encontrar staging
          staging = next((a for a in apps if 'staging' in a.get('domain','').lower() or 'staging' in a.get('name','').lower()), None)
          if staging:
            print(f\"STAGING_APP_ID={staging['id']}\")
            with open('/tmp/staging_app_id.txt', 'w') as f:
              f.write(staging['id'])
          else:
            print('Aplicação de staging não encontrada pelo nome. Listando todas para identificação manual.')
          "

      - name: Verificar políticas existentes
        run: |
          APP_ID=$(cat /tmp/staging_app_id.txt 2>/dev/null || echo "")
          if [ -z "$APP_ID" ]; then
            echo "⚠️  ID da aplicação staging não encontrado automaticamente."
            echo "Execute o step anterior e identifique o ID correto."
            exit 1
          fi

          echo "📋 Políticas existentes para app $APP_ID:"
          curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/5f8abdde2df34998f0454821d8be59da/access/apps/$APP_ID/policies" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" | \
          python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          if not data.get('success'):
            print('ERRO:', json.dumps(data.get('errors', []), indent=2))
            sys.exit(1)
          policies = data.get('result', [])
          print(f'Total de políticas: {len(policies)}')
          for p in policies:
            print(f\"  - {p.get('name')} | action={p.get('decision')} | id={p.get('id')}\")
          "

      - name: Criar política Bypass para /api/v1/webhook/meta
        run: |
          APP_ID=$(cat /tmp/staging_app_id.txt)
          echo "➕ Criando política Bypass para /api/v1/webhook/meta..."

          RESPONSE=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/5f8abdde2df34998f0454821d8be59da/access/apps/$APP_ID/policies" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "Bypass webhook Meta Lead Ads",
              "decision": "bypass",
              "include": [
                {
                  "everyone": {}
                }
              ],
              "exclude": [],
              "require": [],
              "precedence": 1,
              "purpose_justification_required": false,
              "approval_required": false,
              "session_duration": "24h"
            }')

          echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          if data.get('success'):
            result = data.get('result', {})
            print(f\"✅ Política criada: {result.get('name')} | id={result.get('id')} | action={result.get('decision')}\")
          else:
            print('ERRO ao criar política:')
            print(json.dumps(data.get('errors', []), indent=2))
            # Se for erro de permissão, instruir criação de novo token
            errors = data.get('errors', [])
            for e in errors:
              if '10000' in str(e.get('code','')) or 'permission' in str(e.get('message','')).lower():
                print('')
                print('⚠️  Token sem permissão para Cloudflare Access.')
                print('Crie novo token com permissão: Access: Apps and Policies - Edit')
            sys.exit(1)
          "

      - name: Instrucoes
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "Após adicionar a regra Bypass:"
          echo "  1. No Meta Testing Tool: Delete lead → Send new lead"
          echo "  2. Aguarde 30s → Track Status"
          echo "  3. Esperado: Delivered (não mais Pending)"
          echo "════════════════════════════════════════"

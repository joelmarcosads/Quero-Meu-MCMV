name: Testar Webhook Meta — Staging

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite TESTAR para executar'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  test-webhook:
    name: Testes HTTP webhook Meta — staging
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirmar == 'TESTAR' }}

    env:
      BASE_URL: "https://api-staging.queromeumcmv.com.br"
      WEBHOOK_PATH: "/api/v1/webhook/meta"
      META_VERIFY_TOKEN: ${{ secrets.STAGING_META_VERIFY_TOKEN }}

    steps:
      - name: "Diagnóstico — seguir redirect e identificar bloqueio"
        run: |
          echo "=== Teste com verbose (sem token no output) ==="
          # Segue redirects, mostra headers de resposta
          curl -sS -L -D - -o /dev/null \
            "${BASE_URL}${WEBHOOK_PATH}?hub.mode=subscribe&hub.verify_token=token_errado&hub.challenge=abc" \
            --max-time 10 2>&1 | grep -iE "^HTTP|^location:|^cf-|^set-cookie:" | sed 's/cf-access.*token.*/[CF-TOKEN MASKED]/i'
          echo ""
          echo "=== Status sem seguir redirect ==="
          curl -s -o /dev/null -w "HTTP %{http_code} -> redirect: %{redirect_url}\n" \
            "${BASE_URL}${WEBHOOK_PATH}?hub.mode=subscribe&hub.verify_token=token_errado&hub.challenge=abc" \
            --max-time 10

      - name: "T1 — Token inválido (aceita 403 ou 302 para CF Access)"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${BASE_URL}${WEBHOOK_PATH}?hub.mode=subscribe&hub.verify_token=token_errado_xpto&hub.challenge=challenge_abc123" \
            --max-time 10)
          echo "Status recebido: $STATUS"
          if [ "$STATUS" = "403" ] || [ "$STATUS" = "302" ] || [ "$STATUS" = "401" ]; then
            echo "✅ T1 PASS — token inválido bloqueado ($STATUS)"
          else
            echo "❌ T1 FAIL — esperado 403/302/401, recebido $STATUS"
            exit 1
          fi

      - name: "T2 — Token válido (segue redirect se CF Access redirecionar)"
        run: |
          CHALLENGE="ch_$(date +%s)"
          RESPONSE=$(curl -s -L -w "\nHTTP_STATUS:%{http_code}" \
            "${BASE_URL}${WEBHOOK_PATH}?hub.mode=subscribe&hub.verify_token=${META_VERIFY_TOKEN}&hub.challenge=${CHALLENGE}" \
            --max-time 15)
          BODY=$(echo "$RESPONSE" | head -1)
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          echo "Status final: $STATUS"
          if [ "$STATUS" = "200" ] && echo "$BODY" | grep -qF "$CHALLENGE"; then
            echo "✅ T2 PASS — verificação aprovada, challenge retornado"
          elif [ "$STATUS" = "302" ] || [ "$STATUS" = "403" ]; then
            echo "⚠️  T2 BLOQUEADO — CF Access está interceptando ($STATUS)"
            echo "   Será necessário configurar bypass para a rota /api/v1/webhook/meta"
          else
            echo "❌ T2 FAIL — status=$STATUS body=$BODY"
            exit 1
          fi

      - name: "T6 — Rota privada /api/v1/leads sem token"
        run: |
          STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" \
            "${BASE_URL}/api/v1/leads" \
            --max-time 10)
          echo "Status: $STATUS"
          if [ "$STATUS" = "401" ]; then
            echo "✅ T6 PASS — rota privada protegida (401)"
          elif [ "$STATUS" = "302" ]; then
            echo "ℹ️  T6 — redirecionado pelo CF Access (302)"
          else
            echo "ℹ️  T6 — status: $STATUS"
          fi

      - name: Resumo
        if: always()
        run: |
          echo "Worker: market-imobi-crm-staging"
          echo "URL   : ${BASE_URL}${WEBHOOK_PATH}"
          echo "Token : [não exibido]"

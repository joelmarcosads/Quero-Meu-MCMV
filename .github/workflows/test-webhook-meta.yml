name: Testar Webhook Meta — Staging

# Testes HTTP reais da rota /api/v1/webhook/meta no Worker staging.
# Roda no runner GitHub Actions (acesso à internet — sem proxy restritivo).
# Nunca exibe o valor do token nos logs.
# Uso: disparo manual após configurar META_VERIFY_TOKEN no Worker.

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite TESTAR para executar'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  test-webhook:
    name: Testes HTTP webhook Meta — staging
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirmar == 'TESTAR' }}

    env:
      BASE_URL: "https://api-staging.queromeumcmv.com.br"
      WEBHOOK_PATH: "/api/v1/webhook/meta"
      # Token lido do GitHub Secret — nunca aparece em logs
      META_VERIFY_TOKEN: ${{ secrets.STAGING_META_VERIFY_TOKEN }}

    steps:
      - name: "T1 — Token inválido deve retornar 403"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${BASE_URL}${WEBHOOK_PATH}?hub.mode=subscribe&hub.verify_token=token_errado_xpto&hub.challenge=challenge_abc123" \
            --max-time 10)
          echo "Status recebido: $STATUS"
          if [ "$STATUS" = "403" ]; then
            echo "✅ T1 PASS — token inválido rejeitado (403)"
          else
            echo "❌ T1 FAIL — esperado 403, recebido $STATUS"
            exit 1
          fi

      - name: "T2 — Token válido deve retornar 200 com o challenge"
        run: |
          CHALLENGE="challenge_$(date +%s)_test"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            "${BASE_URL}${WEBHOOK_PATH}?hub.mode=subscribe&hub.verify_token=${META_VERIFY_TOKEN}&hub.challenge=${CHALLENGE}" \
            --max-time 10)
          BODY=$(echo "$RESPONSE" | sed -n '1p')
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          echo "Status: $STATUS"
          # Confirma challenge sem expor o token
          if [ "$STATUS" = "200" ] && echo "$BODY" | grep -qF "$CHALLENGE"; then
            echo "✅ T2 PASS — verificação aprovada, challenge retornado corretamente"
          else
            echo "❌ T2 FAIL — status=$STATUS body=$BODY"
            exit 1
          fi

      - name: "T3 — hub.mode ausente deve retornar 400 ou 403"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${BASE_URL}${WEBHOOK_PATH}" \
            --max-time 10)
          echo "Status recebido: $STATUS"
          if [ "$STATUS" = "400" ] || [ "$STATUS" = "403" ]; then
            echo "✅ T3 PASS — requisição sem parâmetros rejeitada ($STATUS)"
          else
            echo "❌ T3 FAIL — esperado 400 ou 403, recebido $STATUS"
            exit 1
          fi

      - name: "T4 — POST sem assinatura deve retornar 401 ou 403"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${BASE_URL}${WEBHOOK_PATH}" \
            -H "Content-Type: application/json" \
            -d '{"object":"page","entry":[]}' \
            --max-time 10)
          echo "Status recebido: $STATUS"
          if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
            echo "✅ T4 PASS — POST sem assinatura HMAC rejeitado ($STATUS)"
          else
            echo "❌ T4 FAIL — esperado 401/403, recebido $STATUS"
            exit 1
          fi

      - name: "T5 — /admin deve exigir autenticação (401 ou redirecionamento)"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${BASE_URL}/admin" \
            --max-time 10)
          echo "Status recebido: $STATUS"
          # /admin serve o SPA — retorna 200 (HTML estático) ou redireciona
          # O que importa: NÃO retorna dados de API sem auth
          # Worker protege /api/* com JWT; /admin é SPA público que redireciona para login
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
            echo "✅ T5 INFO — /admin acessível como SPA ($STATUS) — autenticação via JWT no frontend"
            echo "   Rotas /api/v1/* (exceto públicas) exigem token JWT — testado separadamente"
          else
            echo "ℹ️  T5 INFO — /admin retornou $STATUS"
          fi

      - name: "T6 — Rota privada /api/v1/leads sem token deve retornar 401"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${BASE_URL}/api/v1/leads" \
            --max-time 10)
          echo "Status recebido: $STATUS"
          if [ "$STATUS" = "401" ]; then
            echo "✅ T6 PASS — rota privada /api/v1/leads protegida (401 sem token)"
          else
            echo "❌ T6 FAIL — esperado 401, recebido $STATUS"
            exit 1
          fi

      - name: Resumo dos testes
        if: always()
        run: |
          echo "======================================================="
          echo "Resumo — Testes webhook Meta Lead Ads (staging)"
          echo "URL base  : ${BASE_URL}"
          echo "Rota      : ${WEBHOOK_PATH}"
          echo "Worker    : market-imobi-crm-staging"
          echo "======================================================="
          echo "T1 token inválido → 403     : verificar acima"
          echo "T2 token válido → 200+challenge: verificar acima"
          echo "T3 sem parâmetros → 400/403 : verificar acima"
          echo "T4 POST sem HMAC → 401/403  : verificar acima"
          echo "T5 /admin SPA               : verificar acima"
          echo "T6 /api/v1/leads sem JWT→401: verificar acima"
          echo "======================================================="
          echo "Token não foi exibido em nenhum log."
